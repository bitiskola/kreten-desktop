[package]
name = "kreten-core"
version = "0.2.1"
edition = "2021"
license = "CC-BY-NC-SA-4.0"
description = "Local-first KRÉTA mobile API and session engine for KRETÉN Desktop"

[dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
fs2 = "0.4"
futures-util = "0.3"
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust", "windows-native", "apple-native", "vendored"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "default-tls", "stream"] }
scraper = { version = "0.24", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros"] }
url = "2"
unicode-normalization = "0.1"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
wiremock = "0.6"
